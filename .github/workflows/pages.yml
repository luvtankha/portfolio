name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v7
      - name: Set up Node for content validation
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate portfolio content and JavaScript
        run: |
          node scripts/check-content.mjs
          node --check dist/content.js
          node --check dist/script.js
          node --check dist/portrait.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish the portfolio
        id: deployment
        uses: actions/deploy-pages@v5
